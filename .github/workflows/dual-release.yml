name: Publish matching Mac and Windows release
on:
  workflow_dispatch:
    inputs:
      mac_run:
        description: Verified Mac 0.4.4 package run
        required: true
      windows_run:
        description: Verified Windows 0.4.4 package run
        required: true
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify both packages, matching sources and version
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_RUN: ${{ inputs.mac_run }}
          WIN_RUN: ${{ inputs.windows_run }}
        run: |
          set -eu
          gh run view "$MAC_RUN" --repo "$GITHUB_REPOSITORY" --json name,conclusion > mac-run.json
          gh run view "$WIN_RUN" --repo "$GITHUB_REPOSITORY" --json name,conclusion > win-run.json
          python3 - <<'PY'
          import json
          mac=json.load(open('mac-run.json'));win=json.load(open('win-run.json'))
          assert mac['name']=='Package verified Mac 0.4.4' and mac['conclusion']=='success'
          assert win['name']=='Package verified Windows display-safety build' and win['conclusion']=='success'
          PY
          gh run download "$MAC_RUN" --repo "$GITHUB_REPOSITORY" -n LinkDesk-macOS-0.4.4 -D mac
          gh run download "$WIN_RUN" --repo "$GITHUB_REPOSITORY" -n LinkDesk-Windows-0.4.4 -D windows
          (cd mac && sha256sum -c SHA256SUMS.txt)
          (cd windows && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          from pathlib import Path
          import json,plistlib,zipfile,subprocess
          version=Path('source/VERSION').read_text().strip();assert version=='0.4.4'
          with zipfile.ZipFile('mac/LinkDesk-macOS-AppleSilicon-0.4.4.zip') as z:
              info=plistlib.loads(z.read('LinkDesk.app/Contents/Info.plist'))
              assert info['CFBundleShortVersionString']==version
              mac=json.loads(z.read('LinkDesk.app/Contents/Resources/build-inputs.json'))
          with zipfile.ZipFile('windows/LinkDesk-Windows-0.4.4.zip') as z:
              win=json.loads(z.read('build-inputs.json').decode('utf-8-sig'))
          for data,paths in [(mac,['source/VERSION','source/macOS','source/core-patches/mac-display-safety.patch','source/scripts/build-mac.sh','source/scripts/bundle-runtime.py','source/scripts/finalize-mac-manifest.py']),(win,['source/VERSION','source/Windows','source/core-patches/windows-display-safety.patch','source/scripts/bundle-runtime.py',':(exclude)source/Windows/*.txt'])]:
              assert data['version']==version
              subprocess.run(['git','fetch','origin',data['sourceCommit']],check=True)
              subprocess.run(['git','diff','--exit-code',data['sourceCommit'],'HEAD','--',*paths],check=True)
          PY
      - name: Publish both independent packages with matching source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir release
          cp mac/LinkDesk-macOS-AppleSilicon-0.4.4.zip windows/LinkDesk-Windows-0.4.4.zip release/
          git archive --format=zip HEAD -o release/LinkDesk-source-0.4.4.zip
          (cd release && sha256sum *.zip > SHA256SUMS.txt)
          cat > notes.md <<'NOTES'
          Mac and Windows are both version 0.4.4. Both apps use one source/VERSION and display their actual assembled version.

          - Both platforms separate login startup, optional sharing startup, and recovery of an explicitly started session. New sharing-start and extra display-wake settings default off.
          - Healthy cores remain running after wake/network changes. Changes coalesce for 10 seconds; selected configuration changes request graceful reload. Manual stop stays stopped; hung/crashed cores do not automatically enter kill/relaunch loops.
          - Mac now has a real native receiver display-wake control matching Windows. Connection/entry does not request display wake; optional extra wake only responds to actual remote input once per observed off cycle. The switches control each receiving computer locally, not the other device, and do not add Wake-on-LAN for sleeping machines.
          - Both complete packages include patched cores, required runtimes, licenses and integrity metadata. Pairing, keyboard mappings and scrolling settings remain compatible. No external Deskflow or .NET installation needed.

          Native core builds, display-policy checks, actual isolated Swift/WPF lifecycle tests, complete runtime/signature checks and package/version checks passed. Hardware cold boot, screen-off/wake and actual cross-device behavior still need verification; no claim of a fully repaired GPU/driver black-screen fault is made.

          Update both apps. Windows: quit from the tray, fully extract the ZIP and retain core/ and ThirdParty/. Mac: replace the app in Applications; updated ad-hoc signed code may need device-control permission renewed. Mac is not notarized and Windows is not release-signed.

          Full LinkDesk source and both patches/build instructions are in the source ZIP. Unchanged upstream source archives remain available at https://github.com/vvanjune/LinkDesk/releases/tag/v0.4.0. No user identities, private keys, pairing records, settings or diagnosis logs are shipped.
          NOTES
          gh release create v0.4.4 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'LinkDesk 0.4.4 — matching Mac and Windows settings' --notes-file notes.md release/*.zip release/SHA256SUMS.txt
