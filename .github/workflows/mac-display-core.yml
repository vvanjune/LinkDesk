name: Mac display-safe core
on:
  workflow_dispatch:
  push:
    paths:
      - 'source/core-patches/mac-display-safety.patch'
      - '.github/workflows/mac-display-core.yml'
permissions:
  contents: read
jobs:
  core:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: deskflow/deskflow
          ref: 90376dfaba2c28dd61c5d4453ae5641c6edec5a3
          path: upstream
      - name: Apply auditable Mac patch
        run: python3 source/scripts/apply-core-patch.py upstream --platform mac
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e
      - uses: actions/checkout@v4
        with:
          repository: openssl/openssl
          ref: 360ffdb6d82f298d8d22c838dc2b7bf61ece056d
          path: openssl-src
      - name: Build matching static OpenSSL 3.6.4
        run: |
          cd openssl-src
          ./Configure darwin64-arm64-cc no-shared no-tests no-module --prefix="$GITHUB_WORKSPACE/openssl-static" -mmacosx-version-min=13.0
          make -j3 build_libs
          make install_dev
      - name: Build Mac core and display policy tests
        run: |
          test "$(uname -m)" = arm64
          cmake -S upstream -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_INSTALLER=OFF -DBUILD_OSX_BUNDLE=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -DOPENSSL_ROOT_DIR="$GITHUB_WORKSPACE/openssl-static"
          cmake --build build --target deskflow-core --parallel 3
          clang++ -std=c++20 -I upstream/src/lib source/tests/DisplayWakePolicyTests.cpp -o build/display-wake-tests
          build/display-wake-tests
          build/bin/deskflow-core --version
          file build/bin/deskflow-core
          otool -L build/bin/deskflow-core
      - uses: actions/upload-artifact@v4
        with:
          name: linkdesk-display-safe-core-arm64
          path: |
            build/bin/deskflow-core
            source/core-patches/mac-display-safety.patch
          retention-days: 14
